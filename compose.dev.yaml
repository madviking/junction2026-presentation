# Local overlay: live-edit content/ and app/ without rebuilding.
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build   (or: make up)
services:
  site:
    environment:
      APP_ENV: ${APP_ENV:-local}
    volumes:
      - ./content:/srv/content:ro
      - ./app:/srv/app:ro
    command: ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT} --reload --reload-dir /srv/app --reload-dir /srv/content"]
