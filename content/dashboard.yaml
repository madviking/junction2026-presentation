# /dashboard story. Keep it simple: each block shows ONLY a headline, one visual (or a short
# text/list) and one plain sentence. Everything else (numbers, caveats, sources) goes in
# `details`, which is folded. Every number traces to the brain repo (path in `source`).
# `chart` = a module name in app/charts/. `details` is Markdown.

title: Who cancer screening misses in Finland
lede: What public data shows about the gap Silta works on. Open “Details and sources” under any block for the numbers behind it.

blocks:
  - id: context
    headline: Finland screens most people well, but not everyone.
    text: Everyone in the right age group is invited by letter to free breast, cervical and colorectal cancer screening. The national goal is that 80% attend everywhere, whatever their native language.
    details: |
      - **Burden:** 13,490 cancer deaths in 2024; breast, cervical, colorectal and lung cancer cause about a third of them (4,635). National cost of cancer €1.40 bn.
      - **Programmes:** breast for women aged 50–69, cervical for women aged 30–64, colorectal being extended to ages 56–74 by 2031.
      - **Targets:** National Cancer Strategy 2026–2035, Goal 2 (80% participation in every programme in every county) and sub-goal 1.3 (people whose native language is not Finnish or Swedish attend at the same level as Finnish and Swedish speakers).
    source: Cancer Registry deaths and incidence 2024; Syöpäsäätiö/NHG costs 2024; National Cancer Strategy 2026–2035 (brain sources/2026-11-13-cancer-deaths-costs.md, sources/2026-11-13-astrazeneca-challenge-pdfs.md)

  - id: gap
    headline: Same invitation letter, about 20 points fewer attend.
    chart: screening_by_language
    takeaway: That is about 16,500 missed screenings a year among people whose native language is not Finnish, Swedish or Sámi.
    details: |
      - Gap in 2024: breast −22.4, cervical −19.9, colorectal −21.1 percentage points (95% CIs within ±0.7).
      - Missed screenings = other-language invitees × (domestic rate − other rate): breast 5,556, cervical 6,844, colorectal 4,161.
      - This is the Cancer Registry's count of every invitee, not a survey.
    source: Finnish Cancer Registry, mass-screening statistics, "Population groups → Native language", published 20 May 2026 (brain sources/2026-11-14-cancerregistry-screening-by-language.md)

  - id: pathway
    headline: The gap opens at the first step, at the door.
    chart: pathway_gap
    takeaway: Once people attend, follow-up is about equal. The one exception is colonoscopy after a positive colorectal test.
    details: |
      - **The first invitation matters most:** only about 18% of people who skipped the previous colorectal round attend the next one, against 91–93% of previous attenders.
      - **Colorectal follow-up:** −8.8 points, pooled 2022–2024 (95% CI 6.3–11.3). 2024 alone is borderline, so we quote the pooled figure.
      - **Waiting time:** a positive test to colonoscopy takes about 3.4 months in Helsinki against about 1.9 nationally. That is a capacity problem, not something an app fixes.
      - Breast "referred on" (−4.4) has an unclear meaning (it could mean fewer false positives), so we do not count it as a gap.
    source: Finnish Cancer Registry native-language tables 2022–2024, colorectal "by previous result" 2024, delay charts 2024 (brain notes/2026-11-14-0145-silta-deep-data-analysis.md)

  - id: who
    headline: The gap is deepest for people born in Africa.
    chart: screening_by_birth_region
    takeaway: They also report the most trouble reaching care at all.
    callout: "Our case study, Somali speakers: Helsinki's second-largest foreign language. People of Somali origin report unmet need for a doctor's care 3–4 times as often as the general population."
    details: |
      - **Access, self-reported (THL FinMonik 2018–19):** people born in the Middle East, North Africa and the rest of Africa have about a third of the general population's odds of saying they can contact care smoothly (odds ratios 0.28–0.43).
      - **Unmet need (THL Maamu 2010–12):** Somali origin 5.5%, Russian 15.2%, Kurdish 28.8%, general population 1.5%. 95% of Somali-origin women saw a municipal health-centre doctor last, so the health centre is where to reach them.
      - **Somali speakers:** 16,115 in Helsinki; 85% of Somali speakers in Finland live in Uusimaa. Speech AI is weak in Somali, so Silta uses checked phrase cards.
      - **Not only education:** the gap is about as large as the gap for women with only primary education (breast 63.5%, cervical 50.8%). After controlling for education, age, urbanisation and unemployment across ~290 municipalities, foreign-language share still lowers breast and colorectal attendance. For cervical, unemployment explains the area differences instead.
    source: Cancer Registry region of birth and education tables 2024; Kuusio et al. BMC Health Serv Res 2022 (FinMonik); IJERPH 2021 18(5):2229 (Maamu); Statistics Finland 11rm 2025; municipal regression (brain sources/2026-11-14-europepmc-unmet-need-and-access-by-origin.md, notes/2026-11-14-0145-silta-deep-data-analysis.md)

  - id: trend
    headline: The gap is growing.
    chart: gap_trend
    takeaway: Breast and cervical gaps have widened since 2020, while the number of other-language invitees grew by a quarter to a third.
    details: |
      - 2020→2024: breast 19.9 → 22.4, cervical 15.6 → 19.9 points (both significant). Colorectal 2022→2024 is flat.
      - **2035 scenario:** if the gap stays the same, ageing and migration roughly double missed screenings, to ~31,500–38,600 a year, and pull national attendance down 1–2 points per programme. This holds 2024 rates constant; it is not a forecast.
    source: Finnish Cancer Registry native-language tables 2020–2024; Statistics Finland 11rl projection (brain notes/2026-11-14-0145-silta-deep-data-analysis.md §1, §6)

  - id: where
    headline: Half of the people affected live in three capital-region counties.
    chart: county_language_vs_breast
    takeaway: Helsinki, our pilot setting, has Finland's lowest breast and colorectal screening attendance.
    details: |
      - 51% of Finland's foreign-language residents live in Helsinki, Vantaa–Kerava and Western Uusimaa.
      - Helsinki: 147,482 foreign-language residents (21.2%); breast 74.3%, colorectal 69.6%, colonoscopy after a positive test 67.8% — all the lowest in Finland.
      - **Area-level only:** this shows *where* to act, not *why*. Across 292 municipalities the correlation is much weaker (r = −0.25).
    source: Statistics Finland 11rm (2025); Sotkanet 3620, 3621, 6103 (2024); Cancer Registry colorectal county tables 2024 (brain sources/2026-11-13-hva-languages.md, sources/2026-11-13-az-county-indicators.md)

  - id: goals
    headline: Three national goals Silta works towards, already measured every year.
    rows:
      columns: [National goal, How it is measured today]
      body:
        - [Equal screening attendance whatever your native language, Cancer Registry attendance by native language]
        - [80% attendance in every programme in every county, THL Sotkanet screening indicators]
        - [Treatment within target times, Cancer Registry colonoscopy after a positive test]
    details: |
      - Equal attendance = sub-goal 1.3; 80% = Goal 2; target times = Goal 3 of the National Cancer Strategy 2026–2035.
      - Sotkanet indicators: 3620 (cervical), 3621 (breast), 6103 (colorectal).
      - No new data collection is needed to see whether Silta works.
    source: National Cancer Strategy 2026–2035 and roadmap 2026–2031; Cancer Registry; THL Sotkanet (brain sources/2026-11-13-astrazeneca-challenge-pdfs.md)

  - id: impact
    headline: Expected impact — being finalised.
    placeholder: No numbers are shown until the method is agreed.

  - id: limits
    headline: What the data can't tell us.
    list:
      - "**No figures for single languages.** The registry only reports “other or unknown language”, so Somali-specific attendance is not measured. We use birth region and surveys instead."
      - "**Correlation, not cause.** Language, education, income and origin overlap. We show a gap, not proof that language causes it."
      - "**Surveys are limited.** They cover ages 18–64, ask about care in general rather than screening, and group people by origin, not language. The Somali data is from 2010–12."
      - "**The symptom stage is invisible.** Finland does not collect time from first symptom to diagnosis, and cancer stage is missing for almost half of lung cancer patients."
      - "**Small groups after a positive test.** Only ~370–560 other-language people a year, so we pool three years."
      - "**Some values are estimates.** Waiting times were read from registry charts, and 2035 figures are scenarios."
    details: |
      **What we don't claim**

      - That translated letters fix it: in a Norwegian randomised trial, letters in the language of origin gave 46.5% attendance vs 47.4% for standard ones.
      - That the colorectal gap is widening, or that breast and cervical follow-up needs help.
      - That counties with more minorities have worse survival: the data does not show that.

      **How certain the main gaps are** (other-language minus domestic, 95% CI)

      | Claim | Gap (pp) | 95% CI |
      | --- | --- | --- |
      | Breast attendance 2024 | −22.4 | −23.0 to −21.7 |
      | Cervical attendance 2024 | −19.8 | −20.4 to −19.3 |
      | Colorectal attendance 2024 | −21.2 | −21.9 to −20.5 |
      | Breast gap widened 2020→24 | +2.5 | +1.6 to +3.4 |
      | Cervical gap widened 2020→24 | +4.2 | +3.4 to +5.0 |
      | Colorectal gap change 2022→24 | −0.6 | −1.7 to +0.4 (not significant) |
      | Colonoscopy after positive test, 2022–24 | −8.8 | −11.3 to −6.3 |
      | Colposcopy after referral 2024 | +2.3 | −0.6 to +5.2 (no gap) |

      **Sources**

      - Finnish Cancer Registry, mass-screening statistics, published 20 May 2026 — <https://stats.cancerregistry.fi/joukkistilastot/>
      - THL Sotkanet indicators 3620, 3621, 6103 — <https://sotkanet.fi>
      - Statistics Finland 11rm, 11rl — <https://pxdata.stat.fi>
      - National Cancer Strategy 2026–2035 and roadmap 2026–2031 (Ministry of Social Affairs and Health)
      - Kuusio et al., BMC Health Services Research 2022 (FinMonik) — <https://doi.org/10.1186/s12913-022-08155-3>
      - Unmet need among adults of Russian, Somali and Kurdish origin, IJERPH 2021 — <https://doi.org/10.3390/ijerph18052229>
      - Lung cancer quality report, Syöpäjärjestöt, April 2026
      - Every captured source and the analysis: team knowledge base (`madviking/junction2026`, folders `sources/` and `notes/`)
    source: brain notes/2026-11-14-0145-silta-deep-data-analysis.md; sources/2026-11-14-web-research-barriers-and-data-gaps.md; sources/2026-11-14-europepmc-unmet-need-and-access-by-origin.md
