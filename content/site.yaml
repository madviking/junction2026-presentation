# Site-wide settings. Edit freely; changes show on reload (no rebuild needed with `make up`).
# Links can be overridden per deployment with env vars: SILTA_<KEY>_URL (e.g. SILTA_CONSUMER_URL).
# Defaults are the live Aiven deployment, so printouts made locally carry the right QR code;
# set SILTA_CONSUMER_URL=http://localhost:5300/ (etc.) to point a local site at a local app.

name: Silta
meaning: Finnish for “bridge”
# Shown in the hero, the browser title and the meta description. Ties to the challenge name
# ("Equal Care Across Finland"); the audience is minorities in general, not only language.
punchline: Equal cancer care for minorities in Finland starts before the first appointment.
# One line under the punchline: what Silta does.
lede: Silta takes a person from a symptom or a screening letter to the right door and a visit both sides understand, in their own language and without logging in.
event: Junction 2026 · AstraZeneca — Equal Care Across Finland

# Landing-page phone slider, in journey order. Recapture with `node scripts/capture_screens.mjs`
# (needs the app running; see the script header).
hero_screens:
  - src: /media/screens/slider-01-language.png
    alt: "Silta's first screen: 'Choose your language' with a red 112 call button and a grid of 14 languages."
    caption: Pick your language. The 112 button stays on every screen.
  - src: /media/screens/slider-02-body-map.png
    alt: "'What worries you?' with a body figure, body-part buttons and picture cards with speaker buttons."
    caption: Hard to read? Tap where it is on the body. Every card has a picture and a speaker button.
  - src: /media/screens/slider-03-body-map-chosen.png
    alt: "The chest is highlighted on the body figure and the 'A cough for over 3 weeks' card is ticked."
    caption: Tap the chest and only chest symptoms stay. No name, no ID.
  - src: /media/screens/slider-04-route.png
    alt: "'Where do you get health care?' with route cards, each with a speaker button, and a free-text box with a microphone button."
    caption: Where do you get care? Answer by card, by typing or by speaking.
  - src: /media/screens/slider-05-door.png
    alt: "'Contact the county health station and ask for an assessment today', then the call script in Finnish with English meanings."
    caption: The right door, and the words to say in Finnish, with their meaning and audio.
  - src: /media/screens/slider-06-body-map-ar.png
    alt: "The same symptom screen in Arabic, laid out right to left."
    caption: The same screen in Arabic, right to left.

# Landing-page highlights, between the hero text and the phone. Icon = Tabler icon name.
highlights:
  - icon: bolt
    title: Works from day one
    text: No county contract or integration needed
  - icon: shield-check
    title: No personal data
    text: Not a medical device by design
  - icon: language
    title: 14 languages
    text: Read aloud, tap, type or speak

# Landing page: how Silta connects to Goal 3 of the National Cancer Strategy 2026-2035.
# Indicators from the strategy (Figure 1, p. 5). Numbers: lung-cancer intervals from brain
# sources/2026-11-13-web-research-az-gaps-interventions.md (UEF Kuittinen, unpublished, via Yle MOT);
# screening gap from sources/2026-11-14-cancerregistry-screening-by-language.md (2024: breast 22.4,
# cervical 19.9, colorectal 21.1 pp); 16,561 from notes/2026-11-14-1630-silta-financial-lean-case.md.
# Each point can carry `src` + `src_url` (shown as "Source: ..."); `src_link` uses a key from `links`; `src_label` changes the prefix.
goal3:
  eyebrow: National Cancer Strategy 2026–2035
  title: "Goal 3: equal and effective cancer care"
  lede: Goal 3 is measured by treatment starting on time, cancer mortality and survival. For people with another native language, the gap opens before the first contact, where no register looks. That is where Silta works.
  points:
    - indicator: Treatment within target times
      text: In lung cancer, over 50 of about 155 days pass before the first contact. Silta shortens that part with the right door, the words to say in Finnish and a reminder to call if nothing arrives.
      src: UEF study (unpublished), reported by Yle MOT
      src_url: https://yle.fi/a/74-20251023
    - indicator: Mortality and survival
      text: People with another native language attend screening 20–22 points less often in all three programmes. Attending like Finnish and Swedish speakers would mean 16,561 more people screened a year.
      src: Finnish Cancer Registry, 2024
      src_url: https://stats.cancerregistry.fi/joukkistilastot/
    - indicator: A number a county can follow
      text: Registers do not record the steps before the first contact. Silta counts them anonymously, by stage and language.
      src_label: Live
      src: county view
      src_link: county

# Landing page: safe to use now, and how it grows into the health system.
# Sources: brain ideas/silta.md sections 5-6 and 8 (EU MDR Rule 11, GDPR Art. 9), ideas/silta-service-paths.md.
rollout:
  eyebrow: Regulation and rollout
  title: Safe to use today, without waiting for the health system
  lede: Silta is built to stay on the information side of medical-device and privacy rules, so residents can use it before any county or doctor takes part.
  stages:
    - when: Today
      title: Works on its own
      status: Live
      items:
        - "Not a medical device by design: no diagnosis and no urgency rating (EU MDR Rule 11)."
        - "No personal data: no names, ID numbers, phone numbers or emails (GDPR Art. 9)."
        - Official guidance with a link to its source. 112 and 116117 on every screen.
        - Prepares the visit. It does not replace a professional interpreter.
    - when: Next
      title: With a county
      status: Built, needs a pilot
      items:
        - A Silta QR code on every screening letter.
        - The clinic opens the visit code and reads a one-screen Finnish summary.
        - The county view shows where people stop, by stage and language.
    - when: Later
      title: Inside the care pathway
      status: Planned
      items:
        - An overdue-screening prompt from the patient record system.
        - National guidance from Terveyskylä by article ID.
        - The county as data controller, with its own impact assessment.
        - Native-speaker and clinical review of every language.

# Landing page: where Silta sits on the routes into cancer care. A simplified version of the
# pathway slide (content/data/pathway.json: nodes and the Silta bands); drawn by
# app/templates/_paths_fit.html. Steps follow the bands find/prepare, navigate, atvisit+clinician, after.
paths_fit:
  eyebrow: Where Silta fits
  title: Three ways into cancer care. Silta helps on each one until the diagnostic exam.
  lede: People reach cancer care through a screening letter, a symptom they notice or a test a doctor orders. Silta works in the steps before specialist care takes over.
  link: See the full pathway, its gaps and their evidence
  steps:
    - title: Understand
      text: The screening letter or the symptom, explained in your own language.
    - title: Find the right door
      text: Who to contact in your county, and the words to say in Finnish.
    - title: At the visit
      text: A visit card. The clinician reads a one-screen Finnish summary.
    - title: After the visit
      text: What happens next, and when to call if nothing arrives.
  # Shown in the specialist-care zone of the figure: not built yet.
  planned:
    tag: Planned
    items:
      - Help navigate the treatment path
      - Own-language support and patient information

# Keys are used by printouts (`qr: consumer`) and the "Try the app" page.
# The "Try the app" page shows the links named in `link_groups`, in that order;
# `source` appears under its technical section. Other keys (e.g. `site`) stay
# available to printouts but are not listed there.
link_groups:
  - title: For residents
    lede: What a resident sees — the app, the screening letter and its guide, and the phone line.
    links: [consumer, screening_letter, screening_guide, phone]
  - title: For the county
    lede: What county staff see — anonymous figures, and the tools to run the content.
    links: [county, admin]

links:
  consumer:
    label: Silta for residents
    url: https://fond-useful-corgi.eur-1.aiven.app/
    description: The mobile web app. Pick a language, describe what you noticed, find the right door.
    icon: device-mobile
  screening_guide:
    label: Screening guide (cervical)
    url: https://fond-useful-corgi.eur-1.aiven.app/r/en/learn/cervical
    description: What the screening letter's QR code opens. A five-part picture guide in 14 languages — why, the visit, your rights, after, common questions. Swap "en" in the address for so, ar, ru, uk, fa, et, sv, fi, zh, yue, vi, th or bg.
    icon: school
  screening_letter:
    label: Example screening letter
    url: https://fond-useful-corgi.eur-1.aiven.app/letter/cervical/en
    description: A cervical screening invitation as a Helsinki resident gets it, with the Silta QR code. Every language, printable. All versions are on the printouts page.
    icon: mail-opened
  # The product's own demo phone line (Twilio number on the ElevenLabs agent
  # "Silta phone line", tech/scripts/phone_agent.py) — public by design, not a personal number.
  phone:
    label: Silta phone line
    url: tel:+18784255777
    display: +1 878 425 5777
    action: Call
    description: Call and talk to Silta in your language. A keypad menu picks the language, or just speak; the agent finds the right door for your area. US number; calls from Finland are international.
    icon: phone-call
  county:
    label: County view
    url: https://fond-useful-corgi.eur-1.aiven.app/county/helsinki
    description: Public figures and anonymous counts by stage, outcome and language.
    icon: map-2
  admin:
    label: Admin
    url: https://fond-useful-corgi.eur-1.aiven.app/admin
    description: Edit and publish texts, approve audio, usage and audit.
    icon: settings
    # Public on purpose: a view-only account that sees every admin page and cannot change
    # anything (tech/backend/admin/service.ts, DEMO_VIEWER). The sign-in page shows it too.
    # Team editor accounts stay in the password manager.
    demo_login:
      email: demo@silta.test
      password: silta-demo-viewer
  source:
    label: Source code
    url: https://github.com/madviking/junction2026tech
    description: Encore.ts backend, React + Mantine frontend, PostgreSQL with pgvector on Aiven.
    icon: brand-github
  site:
    label: This site
    url: https://mostly-awaited-flounder.eur-1.aiven.app/
    description: Landing page, data, deck and video.
    icon: world

