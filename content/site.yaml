# Site-wide settings. Edit freely; changes show on reload (no rebuild needed with `make up`).
# Links can be overridden per deployment with env vars: SILTA_<KEY>_URL (e.g. SILTA_CONSUMER_URL).
# Defaults are the live Aiven deployment, so printouts made locally carry the right QR code;
# set SILTA_CONSUMER_URL=http://localhost:5300/ (etc.) to point a local site at a local app.

name: Silta
meaning: Finnish for “bridge”
punchline: Helps language minorities in Finland act on possible cancer symptoms and use screening, in their own language.
event: Junction 2026 · AstraZeneca — Equal Care Across Finland

# Landing-page phone slider, in journey order. Recapture with `node scripts/capture_screens.mjs`
# (needs the app running; see the script header).
hero_screens:
  - src: /media/screens/slider-01-language.png
    alt: "Silta's first screen: a list of languages under a red Emergency? Call 112 button."
    caption: Pick your language. The 112 button stays on every screen.
  - src: /media/screens/slider-02-body-map.png
    alt: "'What worries you?' with a body figure, body-part buttons and picture cards with speaker buttons."
    caption: Hard to read? Tap where it is on the body. Every card has a picture and a speaker button.
  - src: /media/screens/slider-03-body-map-chosen.png
    alt: "The chest is highlighted on the body figure and the 'A cough for over 3 weeks' card is ticked."
    caption: Tap the chest and only chest symptoms stay. No name, no ID.
  - src: /media/screens/slider-04-route.png
    alt: "'Where do you get health care?' with three guiding questions, a free-text box and a Tap to speak button."
    caption: Where do you get care? Answer by card, by typing or by speaking.
  - src: /media/screens/slider-05-door.png
    alt: "'Contact the county health station and ask for an assessment today', then the call script in Finnish with English meanings."
    caption: The right door, and the words to say in Finnish, with their meaning and audio.
  - src: /media/screens/slider-06-body-map-ar.png
    alt: "The same symptom screen in Arabic, laid out right to left."
    caption: The same screen in Arabic, right to left.

facts:
  - value: "646,392"
    label: people in Finland speak a language other than Finnish, Swedish or Sámi — 11.4% of the population (2025).
    source: Statistics Finland, table 11rm
  - value: "60.8%"
    label: of invitees whose native language is not Finnish, Swedish or Sámi attended breast screening in 2024, against 83.2% of everyone else.
    source: Finnish Cancer Registry
  - value: "+4.3 pp"
    label: The cervical screening gap grew from 15.6 to 19.9 points between 2020 and 2024.
    source: Finnish Cancer Registry
  - value: "45.1%"
    label: breast screening attendance among women born in Africa, against 83.1% for women born in Finland (2024).
    source: Finnish Cancer Registry

