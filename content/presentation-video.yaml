# The deck cut for the recorded video: /presentation/record. Opens a slide picker (tick, untick,
# drag to reorder), then plays the chosen slides full screen with no arrows, page numbers or
# progress bar. The choice is kept in the address (?slides=a,b,c), so a retake reopens the same cut.
#
# Each entry is one of:
#   - use: <id>              a slide of content/presentation-v3.yaml, by its id. Any other keys
#                            override that slide for the video only (e.g. notes: the voice-over).
#   - layout: ..., id: ...   a video-only slide, same format as presentation-v3.yaml, own unique id.
# Add `skip: true` to leave an entry unticked in the picker. Deck slides not listed here appear at
# the end of the picker, unticked. Speaker notes (press S while playing) show the `notes`.
#
# Example video-only slide:
#   - layout: intro
#     id: video-title
#     kicker: Junction 2026 · AstraZeneca
#     title: Equal care across Finland
#     line: "One sentence for the voice-over to start on."
#
# Layout `film` (video only): one clip fills the slide and plays from the start each time the slide
# is shown, muted unless `sound: true`. When it ends the deck fades on to the next slide by itself
# (or press → to move on earlier). Keys: src, label (picker name), source (optional small line in the
# corner), exit (default `black`: leaving the slide, by the clip ending or by a keypress, fades
# slowly to black and then from black into the next slide; `plain` for a normal slow fade), overlay (lines of a lower third that fades in about 1 s after the clip starts, holds
# about 6 s and fades out; the first line small, the rest large), notes. The AI-footage disclaimer
# lives elsewhere in the video, not on these slides.
#
# `animate: words` (intro slides): on arrival the kicker fades in, then the title if there is one, then the line rises in word by word with a
# pause after each sentence, numbers count up as they appear and the <b> part gets a highlight.

# Layout `fit` (deck v3 layout): the front page's simplified map of the routes into care, with the
# steps where Silta helps (text from site.yaml `paths_fit`).

title: Silta — Junction 2026 video

slides:
  - layout: film
    id: hodan-film
    label: "Film: Hodan opens the letter (15 s)"
    src: /team/m/video-assets/generated/hodan-01-opening-the-letter.mp4
    overlay:
      - "Junction 2026 — AstraZeneca — Equal Care Across Finland"
      - "3rdGen team Railo"
    notes: "15 s, no sound. Start the voice-over as she opens the envelope; the deck moves on when the clip ends. VO (0:02): This is Hodan. She is fifty-four, has lived in Helsinki for years, and her language is Somali. This is her second invitation to cervical cancer screening, in Finnish."
  # Voice-over: the "VO" part of each `notes` is the narrator's line for that slide (press S while the
  # cut plays). One continuous narration, about 2.7 words a second: content/materials/video-voiceover.md.
  - use: hodan
    head_image: ~   # the film plays just before, so no still under the text
    notes: "VO (0:15): She puts it in a drawer, and she doesn't go."
  - use: gap
    notes: "VO (0:19): She is not alone. People whose native language isn't Finnish or Swedish get the same letters, and twenty-seven percent fewer of them come, in every screening programme."
  - use: earlier
    skip: true   # out of the 2:00 cut (video-voiceover.md)
    notes: "Not in the 2:00 cut (video-voiceover.md). No VO line."
  - use: routes
    skip: true   # out of the 2:00 cut: shows 57% vs 78% right after the VO says 27%
    notes: "Not in the 2:00 cut: it shows 57% vs 78% right after the VO says 27%. No VO line."
    animate: words   # the line builds up sentence by sentence, the numbers count up, the finding is highlighted
  # The simpler pathway slide plays by default; the data-heavy one stays in the picker, unticked.
  - layout: fit
    id: pathway-simple
    label: "Where Silta fits: the routes into care, simplified"
    kicker: Where Silta fits
    title: Three ways into cancer care.
    notes: "VO (0:30): People reach cancer care in three ways, and the gap opens at the start, before anyone in health care has met them. That's where Silta works. (The front page's map: all three routes meet at the diagnostic exam; specialist care is planned next.)"
  - use: pathway
    skip: true
  - use: silta
    notes: "VO (0:40): Silta is Finnish for bridge."
  - use: letter
    notes: "VO (0:42): Hodan scans the code on her letter, [→ once: the letter shrinks into the guide] and Silta explains the screening in Somali, read aloud: what happens, that she can ask for a woman to take the sample, and what to say at the visit, in Finnish."
  - layout: film
    id: olga-film
    label: "Film: Olga notices something (8 s)"
    src: /team/m/video-assets/generated/olga-01-she-notices.mp4
    notes: "8 s, no sound. Olga at the mirror, her hand over her chest. The deck moves on to her symptom screens when the clip ends. VO (0:56): The second way in is a symptom. Olga is fifty-eight and has found a lump."
  - use: noticed
    notes: "VO (1:04): She taps where it is, in Russian. Silta never rates her symptoms."
  - use: door
    notes: "VO (1:09): It shows each of them the right service and the Finnish sentences to say."
  - use: visit
    notes: "VO (1:14): At the visit, the doctor reads Olga's answers in Finnish, on her own phone."
  - use: county
    notes: "VO (1:20): A county needs no IT project to join. It adds one printed code to the letters it already sends, and the registry's figures by native language show whether more people come."
  - use: safe
    notes: "VO (1:32): Silta gives no diagnosis and stores no names."
  - use: reach
    skip: true   # out of the 2:00 cut (video-voiceover.md)
    animate: words   # kicker, then the title, then the line word by word
    notes: "Not in the 2:00 cut (video-voiceover.md). No VO line."
  - use: ways-in
    skip: true   # the discovery part is out of the 2:00 cut
    notes: "Not in the 2:00 cut (discovery). No VO line."
  - use: running
    notes: "VO (1:36): It already runs in fourteen languages. ElevenLabs reads it aloud, turns speech into text, and runs a phone line in the caller's language. Gemini matches a person's words to a card and asks first. It all runs on Aiven, in the EU. [Let the reel play.]"
  - use: close
    notes: "VO (1:52): We propose a pilot in Helsinki. Silta works before the first appointment, from today."
  - use: team
    notes: "VO (1:57): Timo, Milla and Mea Railo. The export must end before 2:00."
