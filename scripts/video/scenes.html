<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silta video scenes</title>
<!-- Motion graphics for the pitch video, built on the Silta design system (deck v3, content/materials/silta-design-system.html):
     1920×1080 = every deck size × 1.5, title-safe 108 px sides/top and 84 px bottom, the deck frame (rail · head + stage · foot),
     colour by meaning (coral = Hodan and the gap, lake = Silta and facts, moss = money), 300 ms fades and one designed moment per scene.
     Deterministic: window.render(t) draws ?scene=<id> at t seconds. Rendered by scripts/video/render.mjs; preview with ?scene=<id>&play. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  --paper: #f6f7f5; --white: #ffffff; --ink: #142028; --muted: #56636b; --line: #d9dfdc;
  --lake: #1d5f8a; --lake-soft: #dcebf5; --coral: #c2512f; --coral-soft: #f7e3db; --moss: #2f6f4f; --moss-soft: #dfeee5;
  --shadow: 0 15px 45px rgba(20, 32, 40, 0.14);
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Atkinson Hyperlegible", Verdana, sans-serif;
  --f-mono: "IBM Plex Mono", Menlo, monospace;
  /* deck sizes × 1.5 */
  --t-hero: 225px; --t-title: 78px; --t-number: 66px; --t-line: 36px; --t-body: 27px; --t-small: 22px; --t-label: 20px; --t-source: 18px;
  --s1: 12px; --s2: 24px; --s3: 36px; --s4: 48px; --s5: 72px; --s6: 96px;
  --radius: 21px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); }
body.transparent { background: transparent; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }

/* the frame: margins 84 top · 108 sides · 54 bottom (deck 56/72/36 × 1.5) */
.frame { position: absolute; inset: 0; padding: 84px 108px 54px; display: grid; grid-template-rows: 42px minmax(0, 1fr) 60px; row-gap: var(--s3); }
.rail { display: flex; align-items: center; justify-content: space-between; }
.kicker { font: 600 var(--t-label)/1 var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--coral); }
.path { list-style: none; display: flex; gap: var(--s3); font: 500 var(--t-label)/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.path li { display: flex; align-items: center; gap: var(--s1); opacity: 0.55; }
.path li i { width: 15px; height: 15px; border-radius: 50%; border: 3px solid currentColor; }
.path li.done { opacity: 0.8; } .path li.done i { background: currentColor; }
.path li.now { opacity: 1; color: var(--coral); } .path li.now i { background: var(--coral); border-color: var(--coral); box-shadow: 0 0 0 6px var(--coral-soft); }
.body { display: grid; grid-template-columns: 645px minmax(0, 1fr); column-gap: var(--s5); min-height: 0; }
.wide .body { grid-template-columns: 750px minmax(0, 1fr); }
.head { display: flex; flex-direction: column; gap: var(--s3); align-self: start; padding-top: var(--s4); }
.title { font: 800 var(--t-title)/1.04 var(--f-display); letter-spacing: -0.02em; text-wrap: balance; }
.title em { font-style: normal; color: var(--coral); }
.title.big { font-size: 108px; }
.line { font: 400 var(--t-line)/1.4 var(--f-body); text-wrap: pretty; }
.line b { color: var(--coral); }
.stagebox { position: relative; min-height: 0; }
.foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); border-top: 1.5px solid var(--line); padding-top: 14px; }
.source { font: 500 var(--t-source)/1.35 var(--f-mono); color: var(--muted); text-align: right; max-width: 1000px; }
.tag { display: inline-flex; align-items: center; gap: var(--s1); font: 700 var(--t-small)/1 var(--f-body); color: var(--k, var(--ink)); background: var(--white); border: 2px solid var(--k, var(--ink)); border-radius: 999px; padding: 10px 21px 10px 15px; }
.tag i { width: 14px; height: 14px; border-radius: 50%; background: var(--k, var(--ink)); }
.k-county { --k: var(--lake); } .k-person { --k: var(--coral); }

/* number card: full frame on paper */
.numcard { position: absolute; inset: 84px 108px 84px; display: grid; align-content: center; gap: var(--s3); }
.hero { font: 800 var(--t-hero)/0.9 var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.numcard .line { max-width: 1100px; font-size: 44px; }
.numcard .source { position: absolute; left: 0; bottom: 0; text-align: left; }

/* objects */
.sheetpaper { position: absolute; background: var(--white); box-shadow: var(--shadow); border: 1.5px solid var(--line); overflow: hidden; }
.sheetpaper img { display: block; width: 100%; margin-top: -9.6%; }
.phone { position: absolute; padding: 18px; background: var(--ink); border-radius: 51px; box-shadow: var(--shadow); }
.phone .scr { width: 324px; height: 702px; border-radius: 33px; overflow: hidden; position: relative; background: var(--white); }
.phone .scr img { position: absolute; left: 0; top: 0; width: 324px; display: block; }
.browser { position: absolute; background: var(--white); border-radius: 18px; box-shadow: var(--shadow); border: 1.5px solid var(--line); overflow: hidden; }
.browser .bar { display: flex; gap: 9px; padding: 15px 18px; background: #eef1ef; border-bottom: 1.5px solid var(--line); }
.browser .bar i { width: 15px; height: 15px; border-radius: 50%; background: var(--line); }
.browser img { display: block; width: 100%; }

/* drawer (the one gradient the system allows) */
.drawer { position: absolute; overflow: hidden; }
.drawer .front { position: absolute; left: 0; right: 0; bottom: 0; height: 255px; z-index: 3; background: linear-gradient(#e7e1d6, #d9d1c3);
  border-radius: 15px 15px 0 0; border-top: 4px solid #cfc6b6; box-shadow: 0 -9px 27px rgba(20, 32, 40, 0.12); }
.drawer .front span { position: absolute; left: 50%; top: 72px; width: 180px; height: 21px; margin-left: -90px; border-radius: 11px; background: #b9ae9b; }
.drawer .sheetpaper { z-index: 1; }
.qrstrip { position: absolute; z-index: 2; background: var(--white); border-radius: 12px; box-shadow: var(--shadow); }

/* question plates: lower-third grammar (white plate, 6 px bar in the beat's colour) */
.plate { display: flex; align-items: center; gap: 21px; background: var(--white); border-left: 9px solid var(--coral); border-radius: 6px; padding: 22px 32px 22px 28px;
  box-shadow: 0 8px 24px rgba(20, 32, 40, 0.08); font: 700 36px/1.15 var(--f-body); width: max-content; max-width: 760px; }
.plate .tick { width: 42px; height: 42px; border-radius: 50%; background: var(--lake); color: var(--white); display: grid; place-items: center; font: 700 26px/1 var(--f-body); flex: none; }
.answer { font: 400 30px/1.35 var(--f-body); padding: 14px 0 0 39px; max-width: 760px; }

/* gap bars (deck component × 1.5) */
.gapbars { display: grid; gap: var(--s4); width: 100%; }
.gapbar { display: grid; grid-template-columns: 200px 165px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: var(--s2); row-gap: 10px; align-items: center; }
.gapbar-label { grid-row: 1 / 3; font: 700 32px/1.1 var(--f-body); }
.gapbar-rel { grid-row: 1 / 3; font: 800 var(--t-number)/1 var(--f-display); color: var(--coral); font-variant-numeric: tabular-nums; }
.gapbar-track { height: 33px; display: flex; align-items: center; gap: var(--s1); }
.gapbar-track i { display: block; height: 100%; border-radius: 6px; }
.gapbar-track b { font: 600 var(--t-small)/1 var(--f-mono); font-variant-numeric: tabular-nums; }
i.dom { background: var(--lake); } i.oth { background: var(--coral); }
.legend { display: flex; gap: var(--s3); font: 400 var(--t-small)/1 var(--f-body); color: var(--muted); padding-left: 389px; }
.legend i { display: inline-block; width: 18px; height: 18px; border-radius: 4px; margin-right: 9px; vertical-align: -2px; }

/* stage strip (pathway) */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
.strip li { list-style: none; padding: var(--s2) var(--s2) 0; display: grid; gap: 12px; border-top: 12px solid var(--line); align-content: start; }
.strip li b { font: 800 36px/1.1 var(--f-display); }
.strip li span { font: 400 var(--t-small)/1.35 var(--f-body); color: var(--muted); }
.strip li .v { font: 800 var(--t-number)/1 var(--f-display); font-variant-numeric: tabular-nums; }

/* steps (two paths, ladder) */
.steps { display: grid; gap: 0; }
.step { display: grid; grid-template-columns: 36px 1fr; gap: 24px; align-items: center; height: 84px; font: 400 32px/1.2 var(--f-body); }
.step .dot { width: 30px; height: 30px; border-radius: 50%; border: 4px solid var(--line); background: var(--paper); justify-self: center; position: relative; z-index: 1; }
.rung { display: grid; grid-template-columns: 72px 1fr auto; gap: var(--s2); align-items: center; background: var(--white); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 20px 26px; }
.rung .n { font: 800 var(--t-number)/1 var(--f-display); color: var(--lake); }
.rung b { font: 800 34px/1.15 var(--f-display); display: block; }
.rung span { font: 400 var(--t-small)/1.35 var(--f-body); color: var(--muted); }
.st { font: 600 18px/1 var(--f-mono); letter-spacing: .08em; padding: 7px 12px; border-radius: 6px; }
.st.live { background: var(--lake); color: var(--white); } .st.built { background: var(--lake-soft); color: var(--lake); }

/* trend */
.trend .grid { stroke: var(--line); stroke-width: 1.5; }
.trend .axis { fill: var(--muted); font: 500 20px var(--f-mono); }
.trend .ln { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.trend .end { font: 700 26px var(--f-body); }

.logos { display: flex; align-items: center; gap: var(--s5); }
.logos img { height: 40px; width: auto; filter: brightness(0); opacity: 0.72; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const SCR = '../../content/materials/video-assets/screens/';
const DECK = '../../content/materials/video-assets/deck/';
const PATH = ['Letter', 'Symptom', 'Found', 'Door', 'Visit'];

// ---- timing helpers -------------------------------------------------------------------
const clamp = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, k) => a + (b - a) * k;
function bezier(x1, y1, x2, y2) { // CSS cubic-bezier as a function of progress
  const bx = (t) => 3*x1*t*(1-t)**2 + 3*x2*t*t*(1-t) + t**3, by = (t) => 3*y1*t*(1-t)**2 + 3*y2*t*t*(1-t) + t**3;
  return (x) => { x = clamp(x); let lo = 0, hi = 1; for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; bx(m) < x ? lo = m : hi = m; } return by((lo + hi) / 2); };
}
const SYS = bezier(.5, .05, .3, 1);        // the deck's motion curve (drawer, morph)
const OUT = bezier(.2, .7, .3, 1);
const p = (t, a, d, f = OUT) => f((t - a) / d);
const $ = (s) => document.querySelector(s);
/** The system fade: 300 ms, opacity with a 12 px settle. */
function fade(el, t, at, rise = 12) { if (!el) return; const k = p(t, at, .3); el.style.opacity = k; el.style.translate = `0 ${(1 - k) * rise}px`; }
/** Slow ambient drift for objects (never text): a few pixels over the whole clip. */
function drift(el, t, dx = 6, dy = 4, rot = 0) { el.style.transform = `translate(${Math.sin(t * .35) * dx}px, ${Math.cos(t * .28) * dy}px) rotate(${rot}deg)`; }

// ---- frame builder --------------------------------------------------------------------
function frame({ kicker, path, title, big, line, stage, left = '', source = '', wide }) {
  const pathHtml = path == null ? '' : `<ol class="path" id="path">${PATH.map((s, i) =>
    `<li class="${i === path ? 'now' : (path === 4 && i === 0) || (path === 3 && i === 0) ? 'done' : ''}"><i></i>${s}</li>`).join('')}</ol>`;
  return `<div class="frame ${wide ? 'wide' : ''}">
    <div class="rail"><span class="kicker" id="kick">${kicker}</span>${pathHtml}</div>
    <div class="body"><div class="head"><h2 class="title ${big ? 'big' : ''}" id="ttl">${title}</h2>${line ? `<p class="line" id="ln">${line}</p>` : ''}</div>
      <div class="stagebox" id="stg">${stage}</div></div>
    <div class="foot" id="foot"><div id="fl">${left}</div><div class="source">${source}</div></div></div>`;
}
function frameIn(t, at = 0) { fade($('#kick'), t, at + .1, 0); fade($('#path'), t, at + .1, 0); fade($('#ttl'), t, at + .3); fade($('#ln'), t, at + .7); fade($('#foot'), t, at + .2, 0); }

const QUESTIONS = ['Do I have to undress?', 'What will they do to me?', 'What if it is a man?', 'What do I say, in Finnish?', 'Do I even have to go?'];
const plate = (q, id, answered) => `<div class="plate" id="${id}" ${answered ? 'style="border-left-color:var(--lake)"' : ''}><span class="tick" style="${answered ? '' : 'display:none'}">✓</span><span>${q}</span></div>`;
function answerPlate(t, id, at) { // the coral bar turns lake and the tick appears: answered by Silta
  const el = $('#' + id); const k = p(t, at, .3); const tk = el.querySelector('.tick');
  tk.style.display = k > 0 ? 'grid' : 'none'; tk.style.opacity = k; tk.style.scale = lerp(.6, 1, k);
  el.style.borderLeftColor = k > .5 ? 'var(--lake)' : 'var(--coral)';
}

const S = {};

// 01 · Hodan's questions. Designed moment: the letter lands.
S['01-questions'] = { dur: 10, html: frame({
    kicker: 'Helsinki · cervical screening', wide: true,
    title: 'A letter <em>she can’t use.</em>',
    line: 'Her second invitation to cervical screening, in Finnish.',
    stage: `<div class="sheetpaper" id="lt" style="left:-40px; top:-30px; width:470px; height:760px"><img src="${DECK}letter-fi.png"></div>
      <div id="qs" style="position:absolute; left:400px; top:30px; display:grid; gap:20px">${QUESTIONS.map((q, i) => plate(q, 'q' + i)).join('')}</div>`,
    source: 'Hodan is a composite of the women in the data that follows' }),
  render(t) {
    frameIn(t);
    const lt = $('#lt'); const k = p(t, .2, 1.1, SYS); lt.style.opacity = clamp((t - .2) / .3);
    lt.style.transform = `translateY(${lerp(-700, 0, k)}px) rotate(${lerp(-9, -3, k)}deg)`;
    if (t > 1.3) lt.style.transform = `translate(${Math.sin(t*.35)*5}px, ${Math.cos(t*.28)*4}px) rotate(-3deg)`;
    QUESTIONS.forEach((_, i) => fade($('#q' + i), t, 2.0 + i * 1.25, 18));
  } };

// 02 · Meet Hodan. Designed moment: the letter slides into the drawer (1.8 s).
S['02-drawer'] = { dur: 8, html: frame({
    kicker: 'Helsinki · cervical screening', big: true, wide: true,
    title: 'Meet <em>Hodan.</em>',
    line: 'She is 54. Her language is Somali. She puts the letter away, and doesn’t go.',
    stage: `<div class="drawer" id="dr" style="left:90px; top:-20px; width:690px; height:760px">
      <div class="sheetpaper" id="lt" style="left:90px; top:30px; width:510px; height:720px"><img src="${DECK}letter-fi.png"></div>
      <div class="front"><span></span></div></div>`,
    source: 'Hodan is a composite of the women in the data that follows' }),
  render(t) {
    frameIn(t);
    fade($('#dr'), t, 0, 0);
    const k = p(t, 2.2, 1.8, SYS);
    $('#lt').style.transform = `translateY(${lerp(0, 240, k)}px) rotate(${lerp(-3, -1, k)}deg)`;
  } };

// 03 · The number card. Designed moment: the number counts to 27.
S['03-gap-number'] = { dur: 6, html: `
  <div class="numcard">
    <div class="kicker" id="kick">She is not alone</div>
    <div class="hero" id="hero" style="color:var(--coral)">0%</div>
    <p class="line" id="ln">fewer come to cancer screening when their native language is not Finnish or Swedish.</p>
    <div class="source" id="src">Finnish Cancer Registry, 2024 · relative drop, e.g. breast 60.8% vs 83.2%</div>
  </div>`,
  render(t) {
    fade($('#kick'), t, .1, 0); fade($('#hero'), t, .2, 0); fade($('#ln'), t, 1.4); fade($('#src'), t, 1.8, 0);
    $('#hero').textContent = Math.round(27 * p(t, .3, 1.2, SYS)) + '%';
  } };

// 04 · Gap bars. Designed moment: the bars grow.
const BARS = [['Breast', '−27%', 83.2, 60.8], ['Cervical', '−26%', 76.2, 56.3], ['Colorectal', '−28%', 74.5, 53.4]];
S['04-gap-bars'] = { dur: 8, html: frame({
    kicker: 'She is not alone',
    title: 'Same letter.<br><em>27% fewer come.</em>',
    line: 'People whose native language is not Finnish or Swedish attend less, in every programme.',
    stage: `<div style="position:absolute; inset:110px 0 0 0; display:grid; gap:48px; align-content:start">
      <div class="gapbars">${BARS.map(([l, r, a, b], i) => `<div class="gapbar" id="g${i}"><span class="gapbar-label">${l}</span><span class="gapbar-rel" id="r${i}">${r}</span>
        <span class="gapbar-track"><i class="dom" id="a${i}"></i><b style="color:var(--lake)" id="av${i}">${a}%</b></span>
        <span class="gapbar-track"><i class="oth" id="b${i}"></i><b style="color:var(--coral)" id="bv${i}">${b}%</b></span></div>`).join('')}</div>
      <div class="legend" id="leg"><span><i style="background:var(--lake)"></i>Finnish, Swedish or Sámi</span><span><i style="background:var(--coral)"></i>Another native language</span></div></div>`,
    source: 'Finnish Cancer Registry, invitees by native language, 2024' }),
  render(t) {
    frameIn(t);
    const W = 560 / 100;
    BARS.forEach(([, , a, b], i) => {
      fade($('#g' + i), t, .5 + i * .15, 0);
      const k = p(t, 1.0 + i * .3, 1.2, SYS);
      $('#a' + i).style.width = a * W * k + 'px'; $('#b' + i).style.width = b * W * k + 'px';
      fade($('#av' + i), t, 2.0 + i * .3, 0); fade($('#bv' + i), t, 2.0 + i * .3, 0); fade($('#r' + i), t, 2.4 + i * .3, 0);
    });
    fade($('#leg'), t, 1.2, 0);
  } };

// 05 · The trend. Designed moment: the lines draw.
const TREND = [
  { label: 'Breast', c: 'var(--ink)', w: 4, pts: [[2020, 19.9], [2021, 19.4], [2022, 21.8], [2023, 22.0], [2024, 22.4]], dy: -10 },
  { label: 'Cervical', c: 'var(--coral)', w: 8, pts: [[2020, 15.6], [2021, 16.1], [2022, 17.7], [2023, 17.7], [2024, 19.9]], dy: 30 },
  { label: 'Colorectal', c: '#8a979e', w: 4, pts: [[2022, 21.8], [2023, 21.4], [2024, 21.1]], dy: 8 },
];
const X = (y) => 90 + (y - 2020) * 175, Y = (v) => 560 - (v - 12) * 40;
S['05-trend'] = { dur: 7.5, html: frame({
    kicker: 'And it is growing',
    title: 'The gap is <em>widening.</em>',
    line: 'For cervical screening, from <b>15.6</b> to <b>19.9</b> percentage points in four years.',
    stage: `<svg class="trend" id="tr" viewBox="0 0 1000 640" width="1000" height="640" style="position:absolute; left:0; top:0">
      ${[14, 16, 18, 20, 22, 24].map((v) => `<line class="grid" x1="90" x2="790" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="70" y="${Y(v) + 7}" text-anchor="end">${v}</text>`).join('')}
      ${[2020, 2021, 2022, 2023, 2024].map((y) => `<text class="axis" x="${X(y)}" y="610" text-anchor="middle">${y}</text>`).join('')}
      <text class="axis" x="90" y="${Y(25) - 10}">Gap, percentage points</text>
      ${TREND.map((s, i) => `<path class="ln" id="ln${i}" stroke="${s.c}" stroke-width="${s.w}" d="M${s.pts.map(([y, v]) => `${X(y)},${Y(v)}`).join(' L')}"/>
        ${s.pts.map(([y, v], j) => `<circle id="d${i}_${j}" cx="${X(y)}" cy="${Y(v)}" r="${s.w + 3}" fill="${s.c}"/>`).join('')}
        <text class="end" id="e${i}" x="${X(2024) + 22}" y="${Y(s.pts.at(-1)[1]) + 9 + s.dy}" fill="${s.c}">${s.label} ${s.pts.at(-1)[1]}</text>`).join('')}
    </svg>`,
    source: 'Finnish Cancer Registry, screening by native language 2020–2024' }),
  render(t) {
    frameIn(t);
    TREND.forEach((s, i) => {
      const path = $('#ln' + i); const L = path.getTotalLength(); const k = p(t, 1.0 + (i === 1 ? .6 : 0), 1.8, SYS);
      path.style.strokeDasharray = L; path.style.strokeDashoffset = L * (1 - k);
      s.pts.forEach(([y], j) => { const at = (X(y) - X(s.pts[0][0])) / (X(2024) - X(s.pts[0][0]) || 1); $(`#d${i}_${j}`).style.opacity = k >= at - .001 ? 1 : 0; });
      fade($('#e' + i), t, 3.2 + (i === 1 ? .4 : 0), 0);
    });
  } };

// 06 · Somali-origin women. Number card in coral.
S['06-somali'] = { dur: 6, html: `
  <div class="numcard">
    <div class="kicker" id="kick">Women like Hodan</div>
    <div class="hero" id="hero" style="color:var(--coral)">19%</div>
    <p class="line" id="ln">of Somali-origin women attend cervical screening, against 67% of Finnish women.</p>
    <div class="source" id="src">Peer-reviewed study of migrant-origin women in Finland (PMC7663516)</div>
  </div>`,
  render(t) { fade($('#kick'), t, .1, 0); fade($('#hero'), t, .3); fade($('#ln'), t, 1.0); fade($('#src'), t, 1.4, 0); } };

// 07 · The door. Designed moment: the coral marks the first step.
const STEPS = [['Invitation', 'The letter arrives'], ['Attends', 'The first step'], ['Result', 'Sent by post'], ['Follow-up', 'After an abnormal result']];
S['07-door'] = { dur: 8.5, html: frame({
    kicker: 'Where it opens',
    title: 'The gap opens <em>at the door.</em>',
    line: 'Once people are inside, follow-up is equal. Translating the letter alone did not help.',
    stage: `<div style="position:absolute; inset:130px 0 0 0; display:grid; gap:84px; align-content:start">
      <ul class="strip">${STEPS.map(([b, s], i) => `<li id="s${i}"><b>${b}</b><span>${s}</span>${i === 1 ? '<span class="v" id="v1" style="color:var(--coral)">−27%</span>' : i === 3 ? '<span class="v" id="v3" style="color:var(--lake); font-size:38px; white-space:nowrap">87.1 vs 84.8%</span>' : ''}</li>`).join('')}</ul>
      <div id="nor" style="display:flex; gap:24px; align-items:baseline"><span style="font:800 48px/1 var(--f-display); color:var(--lake); white-space:nowrap">46.5% vs 47.4%</span><span style="font:400 27px/1.3 var(--f-body)">attendance with a translated invitation vs the standard one</span></div></div>`,
    source: 'Finnish Cancer Registry 2024 · randomised trial, Norway (n = 11,347)' }),
  render(t) {
    frameIn(t);
    STEPS.forEach((_, i) => fade($('#s' + i), t, .6 + i * .2, 0));
    const k = p(t, 1.8, .9, SYS);
    $('#s0').style.borderTopColor = $('#s1').style.borderTopColor = `color-mix(in srgb, var(--coral) ${k * 100}%, var(--line))`;
    fade($('#v1'), t, 2.4);
    const k3 = p(t, 3.4, .6, SYS); $('#s3').style.borderTopColor = `color-mix(in srgb, var(--lake) ${k3 * 100}%, var(--line))`;
    fade($('#v3'), t, 3.7); fade($('#nor'), t, 5.2);
  } };

// 08 · Why we start with Hodan. Designed moment: one path crawls, the other is there at once.
const LEFT = ['Procurement', 'Integration', 'Data agreements', 'Value for residents'];
const RIGHT = ['The letter in her hand', 'Silta, in her language', 'Value today'];
const steps = (arr, id) => `<div class="steps" style="position:relative">${arr.map((s, i) => `<div class="step" id="${id}${i}"><span class="dot"></span><span>${s}</span></div>`).join('')}
  <div id="${id}bar" style="position:absolute; left:15px; top:42px; width:6px; border-radius:3px"></div></div>`;
S['08-why'] = { dur: 11, html: frame({
    kicker: 'Why we start with Hodan',
    title: 'Value from <em>day one.</em>',
    line: 'A county system needs procurement and integration first, and registers only see people who already came in.',
    stage: `<div style="position:absolute; inset:48px 0 0 0; display:grid; grid-template-columns:1fr 1fr; gap:48px">
      <div id="cl"><div class="kicker" style="color:var(--muted); margin-bottom:30px">Start with the county</div>${steps(LEFT, 'l')}</div>
      <div id="cr"><div class="kicker" style="color:var(--lake); margin-bottom:30px">Start with Hodan</div>${steps(RIGHT, 'r')}
        <div id="today" class="tag k-county" style="margin-top:30px"><i></i>Works today, with no contract</div></div></div>`,
    source: 'Silta adoption ladder · registers record attendance, not the steps before it' }),
  render(t) {
    frameIn(t); fade($('#cl'), t, .6, 0); fade($('#cr'), t, .9, 0);
    const run = (arr, id, at, dur, col) => {
      const k = p(t, at, dur, clamp); const pos = k * (arr.length - 1);
      $('#' + id + 'bar').style.height = pos * 84 + 'px'; $('#' + id + 'bar').style.background = col;
      arr.forEach((_, i) => { const on = t >= at && pos >= i - .001; const d = $(`#${id}${i} .dot`);
        d.style.borderColor = on ? col : 'var(--line)'; d.style.background = on ? col : 'var(--paper)';
        $(`#${id}${i}`).style.color = on ? 'var(--ink)' : 'var(--muted)'; });
    };
    run(LEFT, 'l', 1.4, 7.0, 'var(--muted)'); run(RIGHT, 'r', 2.0, .9, 'var(--lake)');
    fade($('#today'), t, 3.2);
    $('#cl').style.opacity = lerp(1, .35, p(t, 8.8, .3)) * p(t, .6, .3);
  } };

// phone helper: the deck phone frame (18 px ink bezel around a 324 × 702 screen) with a scripted pan
function panPhone(t, stops) {
  const im = $('#shot'); const max = Math.max(0, im.getBoundingClientRect().height - 702);
  let f = stops[0][1]; for (let i = 1; i < stops.length; i++) { const [t0, f0] = stops[i - 1], [t1, f1] = stops[i]; if (t >= t0) f = lerp(f0, f1, SYS((t - t0) / (t1 - t0))); }
  im.style.transform = `translateY(${-f * max}px)`;
}

// 09 · The letter becomes a lesson. Designed moment: the paper turns into the phone (0.9 s).
S['09-letter-photo'] = { dur: 9, html: frame({
    kicker: 'First way in · the letter', path: 0,
    title: 'The letter becomes <em>a lesson.</em>',
    line: 'She photographs it. Silta explains it in Somali: the time, the place and what to do.',
    stage: `<div class="sheetpaper" id="lt" style="left:170px; top:0; width:500px; height:720px"><img src="${DECK}letter-fi.png"></div>
      <div id="flash" style="position:absolute; left:150px; top:-20px; width:540px; height:760px; background:#fff; opacity:0"></div>
      <div class="phone" id="ph" style="left:260px; top:-6px"><div class="scr"><img id="shot" src="${SCR}so-03-letter-result-full.png"></div></div>`,
    left: '<span class="tag" id="gm"><i></i>Gemini reads the photo</span>',
    source: 'Screens from the running app · machine-made text, checked against the letter' }),
  render(t) {
    frameIn(t);
    const lt = $('#lt'); fade(lt, t, .2, 0);
    const m = p(t, 2.0, .9, SYS);
    lt.style.transform = `translate(${lerp(0, -250, m)}px, ${lerp(0, 90, m)}px) scale(${lerp(1, .62, m)}) rotate(${lerp(-2, -5, m)}deg)`;
    lt.style.opacity = Math.min(lt.style.opacity, lerp(1, .9, m));
    $('#flash').style.opacity = t > 1.7 && t < 2.1 ? .9 * (1 - clamp((t - 1.7) / .4)) : 0;
    const ph = $('#ph'); ph.style.opacity = p(t, 2.15, .6); ph.style.transform = `translate(${lerp(-120, 0, m)}px, 0) scale(${lerp(.6, 1, m)})`; ph.style.transformOrigin = '30% 80%';
    if (t > 3) ph.style.transform = `translate(${Math.sin(t*.35)*4}px, ${Math.cos(t*.28)*3}px)`;
    panPhone(t, [[0, 0], [3.4, 0], [7.4, .5], [9, .5]]);
    fade($('#gm'), t, 3.0, 0);
  } };

// 10 · What happens at the visit. Designed moment: coral questions turn lake as Silta answers them.
S['10-visit'] = { dur: 10, html: frame({
    kicker: 'Her questions, answered', path: 0,
    title: 'What happens <em>at the visit.</em>',
    line: 'Step by step, in Somali, with pictures and a human voice.',
    stage: `<div class="phone" id="ph" style="left:0; top:-6px"><div class="scr"><img id="shot" src="${SCR}so-06-visit-full.png"></div></div>
      <div style="position:absolute; left:420px; top:40px; display:grid; gap:48px">
        <div id="qa0">${plate('Do I have to undress?', 'p0')}<p class="answer" id="a0">From the waist down. She can keep a long top or skirt on.</p></div>
        <div id="qa1">${plate('What will they do to me?', 'p1')}<p class="answer" id="a1">A nurse, a private room, about 10 minutes. She can ask for a pause.</p></div></div>`,
    source: 'Silta cervical screening guide, Somali · screens from the running app' }),
  render(t) {
    frameIn(t); fade($('#ph'), t, .3, 0); $('#ph').style.translate = `${Math.sin(t*.35)*4}px ${Math.cos(t*.28)*3}px`;
    panPhone(t, [[0, 0], [1.4, 0], [3.6, .32], [6.0, .45], [10, .55]]);
    fade($('#qa0'), t, 1.0); answerPlate(t, 'p0', 3.6); fade($('#a0'), t, 3.8);
    fade($('#qa1'), t, 4.8); answerPlate(t, 'p1', 6.6); fade($('#a1'), t, 6.8);
  } };

// 11 · Her rights and the Finnish words. Same moment, plus the sentence for the desk.
S['11-rights'] = { dur: 11, html: frame({
    kicker: 'Her rights · at the visit', path: 4,
    title: 'She can ask <em>for a woman.</em>',
    line: 'Most sample takers are women. Silta gives her the Finnish sentence to show at the desk.',
    stage: `<div class="phone" id="ph" style="left:0; top:-6px"><div class="scr"><img id="shot" src="${SCR}so-07-rights-full.png"></div></div>
      <div style="position:absolute; left:420px; top:40px; display:grid; gap:44px">
        <div id="qa0">${plate('What if it is a man?', 'p0')}<p class="answer" id="a0">She can ask for a woman to take the sample. A request, not a guarantee.</p></div>
        <div id="qa1">${plate('What do I say, in Finnish?', 'p1')}<p class="answer" id="a1"><b style="font-weight:700">“Toivoisin, että näytteen ottaa nainen.”</b><br>Shown on screen, or played aloud.</p></div></div>`,
    left: '<span class="tag" id="el"><i></i>ElevenLabs reads the Finnish aloud</span>',
    source: 'Silta cervical screening guide, Somali · screens from the running app' }),
  render(t) {
    frameIn(t); fade($('#ph'), t, .3, 0); $('#ph').style.translate = `${Math.sin(t*.35)*4}px ${Math.cos(t*.28)*3}px`;
    panPhone(t, [[0, 0], [1.2, 0], [3.4, .22], [5.6, .22], [7.4, .64], [11, .66]]);
    fade($('#qa0'), t, .9); answerPlate(t, 'p0', 3.2); fade($('#a0'), t, 3.4);
    fade($('#qa1'), t, 5.0); answerPlate(t, 'p1', 7.4); fade($('#a1'), t, 7.6); fade($('#el'), t, 7.8, 0);
  } };

// 12 · Each step a county takes. Designed moment: the clinic screen slides in beside the third rung.
const RUNGS = [
  ['0', 'On her own', 'The letter explained, the visit and her rights, in Somali.', 'live', 'LIVE'],
  ['1', 'A QR code on the letter', 'One printed strip on every invitation.', 'built', 'BUILT'],
  ['2', 'The nurse reads her summary', 'In Finnish, before she sits down.', 'built', 'BUILT'],
];
S['12-county'] = { dur: 12, html: frame({
    kicker: 'For the wellbeing services county',
    title: 'Each step <em>adds impact.</em>',
    line: 'Nothing is needed to start. Every step a county takes makes Silta worth more.',
    stage: `<div style="position:absolute; inset:24px 0 0 0; display:grid; gap:16px; width:560px; align-content:start">${RUNGS.map(([n, b, s, c, l], i) =>
      `<div class="rung" id="u${i}"><span class="n">${n}</span><div><b>${b}</b><span>${s}</span></div><span class="st ${c}">${l}</span></div>`).join('')}
      <div class="rung" id="u3" style="grid-template-columns:1fr"><div><b style="color:var(--lake)">56% vs ~13%</b><span>took a self-sampling kit offered at a GP visit, against kits sent by post (London).</span></div></div></div>
      <div class="browser" id="br" style="left:600px; top:40px; width:380px"><div class="bar"><i></i><i></i><i></i></div><img src="${DECK}clinic-fi.png"></div>
      <div class="qrstrip" id="qr" style="left:590px; top:60px; width:390px; padding:6px"><img src="${DECK}letter-qr-block.png" style="width:100%; display:block"></div>`,
    source: 'Silta adoption ladder · kit uptake: London study, GP visit vs by post' }),
  render(t) {
    frameIn(t);
    [0, 1, 2, 3].forEach((i) => fade($('#u' + i), t, 1.0 + i * 2.4, 18));
    const q = $('#qr'); fade(q, t, 3.6, 0); q.style.transform = `translateY(${lerp(30, 0, p(t, 3.4, .9, SYS))}px) rotate(1.5deg)`;
    q.style.opacity = Math.min(q.style.opacity, 1 - p(t, 5.8, .3));
    const b = $('#br'); const k = p(t, 5.9, .9, SYS); b.style.opacity = clamp((t - 5.9) / .3); b.style.transform = `translateX(${lerp(60, 0, k)}px)`;
  } };

// 13 · Close. Designed moment: the letter, now with its QR strip, rises out of the drawer (1.8 s).
S['13-close'] = { dur: 9, html: frame({
    kicker: 'Helsinki pilot', wide: true,
    title: 'Silta works at the door, <em>from today.</em>',
    line: 'Hodan’s next letter carries a QR code.',
    stage: `<div class="drawer" id="dr" style="left:90px; top:-20px; width:690px; height:760px">
      <div class="sheetpaper" id="lt" style="left:90px; top:30px; width:510px; height:720px"><img src="${DECK}letter-fi.png"></div>
      <div class="qrstrip" id="qr" style="left:20px; top:300px; width:650px; padding:6px"><img src="${DECK}letter-qr-block.png" style="width:100%; display:block"></div>
      <div class="front"><span></span></div></div>`,
    left: `<div class="logos" id="lg"><img src="${DECK}google-deepmind.png" alt=""><img src="${DECK}aiven.png" alt=""><img src="${DECK}mlh.png" alt=""></div>`,
    source: 'Timo · Mea · Milla · Hodan is a composite' }),
  render(t) {
    frameIn(t); fade($('#dr'), t, 0, 0);
    const k = p(t, .8, 1.8, SYS);
    $('#lt').style.transform = `translateY(${lerp(285, -6, k)}px) rotate(${lerp(-1, 2, k)}deg)`;
    $('#qr').style.transform = `translateY(${lerp(285, -6, k)}px) rotate(${lerp(-1, 1, k)}deg)`;
    fade($('#lg'), t, 2.6, 0);
  } };

// ---------- overlays: transparent PNGs, cropped to the element ----------
const OVERLAYS = {};
QUESTIONS.forEach((q, i) => { OVERLAYS[`q${i + 1}`] = plate(q, 'x'); OVERLAYS[`q${i + 1}-answered`] = plate(q, 'x', true); });
OVERLAYS['lower-third-hodan'] = `<div style="background:var(--white); border-left:9px solid var(--coral); padding:30px 45px 33px 36px; display:grid; gap:12px; box-shadow:var(--shadow)">
  <span class="kicker">Helsinki · cervical screening</span><span class="title">Hodan, 54</span><span class="line">Her language is Somali.</span></div>`;
OVERLAYS['lower-third-silta'] = `<div style="background:var(--white); border-left:9px solid var(--lake); padding:30px 45px 33px 36px; display:grid; gap:12px; box-shadow:var(--shadow)">
  <span class="kicker" style="color:var(--lake)">Silta · in her language</span><span class="title">No name. No login.</span><span class="line">Works today, before any county joins.</span></div>`;
OVERLAYS['caption-plate'] = `<div style="background:var(--white); padding:18px 30px; border-radius:6px; font:400 36px/1.35 var(--f-body); max-width:1500px">She puts the letter away, and doesn’t go.</div>`;
OVERLAYS['tag-gemini'] = `<span class="tag"><i></i>Gemini reads the photo</span>`;
OVERLAYS['tag-elevenlabs'] = `<span class="tag"><i></i>ElevenLabs reads the Finnish aloud</span>`;
OVERLAYS['tag-aiven'] = `<span class="tag"><i></i>Live on Aiven, in the EU</span>`;
OVERLAYS['tag-composite'] = `<span class="tag k-person"><i></i>Hodan is a composite</span>`;
for (const [k, s] of Object.entries({
  'source-registry': 'Finnish Cancer Registry, invitees by native language, 2024',
  'source-somali': 'Peer-reviewed study of migrant-origin women in Finland (PMC7663516)',
  'source-london': 'Self-sampling kit offered at a GP visit vs by post · London study',
  'source-norway': 'Randomised trial, Norway (n = 11,347)',
})) OVERLAYS[k] = `<div style="background:var(--white); padding:10px 18px; border-radius:6px; font:500 18px/1.35 var(--f-mono); color:var(--muted)">${s}</div>`;

// ---------- boot ----------
const qs = new URLSearchParams(location.search);
const stage = $('#stage');
window.SCENES = Object.fromEntries(Object.entries(S).map(([k, v]) => [k, v.dur]));
window.OVERLAYS = Object.keys(OVERLAYS);
if (qs.get('overlay')) {
  document.body.classList.add('transparent');
  stage.innerHTML = `<div id="ov" style="position:absolute; left:40px; top:40px; display:inline-block">${OVERLAYS[qs.get('overlay')]}</div>`;
} else {
  const sc = S[qs.get('scene') || '01-questions'];
  stage.innerHTML = sc.html;
  window.render = (t) => sc.render(t);
  window.render(0);
  if (qs.has('play')) { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % sc.dur); requestAnimationFrame(loop); }; loop(); }
}
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map((im) => im.complete ? 1 : new Promise((r) => { im.onload = im.onerror = r; }))]);
</script>
</body>
</html>
